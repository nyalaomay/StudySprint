<body>
  <header>
    <h1>StudySprint</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="submit.html">New Session</a></li>

<main>
  <h2>Past Sessions</h2>
  <p id="history-empty" hidden>No sessions yet. Start one from the New Session page.</p>

  <!-- Rows are built by history.js from saved sessions -->
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Topic</th>
        <th>Subject</th>
        <th>Questions</th>
      </tr>
    </thead>
    <tbody id="history-body"></tbody>
  </table>

  <button type="button" id="clear-history" class="btn btn-secondary" style="margin-top: 1.25rem;">Clear History</button>
</main>

  <footer>
    <p>StudySprint — COMP 322 Honors Contract Project</p>
  </footer>

  <script src="storage.js"></script>
  <script src="history.js"></script>
