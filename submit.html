<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudySprint — New Session</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>StudySprint</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="submit.html">New Session</a></li>
        <li><a href="history.html">History</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Start a new study session</h2>
    <p>Paste your notes or enter a topic, and choose a subject area below.</p>

    <!--
      Session submission form.
      Static for M1 — no JS validation or submit handling yet.
      action="#" is a placeholder until the backend (M3) exists.
    -->
    <form class="card" action="#" method="post">
      <label for="topic">Notes or topic</label>
      <textarea id="topic" name="topic" placeholder="Paste your notes here, or type a topic like 'Newton's Laws of Motion'"></textarea>

      <label for="subject">Subject</label>
      <select id="subject" name="subject">
        <option value="">Select a subject</option>
        <option value="math">Math</option>
        <option value="cs">Computer Science</option>
        <option value="science">Science</option>
        <option value="history">History</option>
        <option value="other">Other</option>
      </select>

      <label for="count">Number of questions</label>
      <input type="number" id="count" name="count" min="1" max="10" value="5">

      <button type="submit" class="btn" style="margin-top: 1.5rem;">Generate Practice Questions</button>
    </form>
  </main>

  <footer>
    <p>StudySprint — COMP 322 Honors Contract Project</p>
  </footer>
</body>
</html>
